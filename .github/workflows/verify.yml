name: Verify Rewind
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit and syntax checks
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q rewind scripts tests
          node --check web/app.js
          node --check web/preflight.js
          node --check scripts/browser-check.mjs
          node --check scripts/import-browser-check.mjs
          bash -n infra/install-gvisor.sh
      - name: Install pinned gVisor without a Docker restart
        run: sudo bash infra/install-gvisor.sh
      - name: Actual isolated reference and containment checks
        run: python3 scripts/check-isolation.py
      - name: Browser dependencies
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Actual browser inspection and plan, without inference
        env:
          REWIND_ACCESS_CODE: ci-fictional-example-only
          REWIND_STATE_DIR: .local/ci-state
          REWIND_ORIGIN: http://127.0.0.1:18182
        run: |
          umask 077
          mkdir -p .local
          printf '%s\n' "$REWIND_ACCESS_CODE" > .local/demo-access.txt
          python3 -m rewind.server > /tmp/rewind-ci-server.log 2>&1 &
          rewind_ci_pid=$!
          trap 'kill "$rewind_ci_pid" 2>/dev/null || true' EXIT
          for rewind_ready_attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18182/api/health > /dev/null; then break; fi
            sleep 1
          done
          node scripts/browser-check.mjs --plan-only
          node scripts/import-browser-check.mjs
      - name: Build reviewed source archive
        run: python3 scripts/build-release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rewind-verification
          path: reports/
